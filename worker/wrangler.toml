# Cloudflare Worker config for Lengger Bot
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "lengger-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Routes (uses workers.dev subdomain by default; custom domain optional)
# [[routes]]
# pattern = "/api/telegram-webhook"
# custom_domain = false

# Cloudflare KV namespace (session + quota + logs)
# Create first: `wrangler kv:namespace create BOT_KV`
# Then paste the ID below:
[[kv_namespaces]]
binding = "BOT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Cron Trigger — future v1.2 IG auto-scrape (disabled for v1)
# 08:00 UTC = 15:00 WIB (WIB = UTC+7)
# [triggers]
# crons = ["0 8 * * *"]

# Secrets (set via `wrangler secret put <NAME>`):
# - TELEGRAM_BOT_TOKEN     (from @BotFather)
# - TELEGRAM_WEBHOOK_SECRET (random 32-char string for webhook auth)
# - USER_CHAT_ID          (your personal chat ID — bot only responds to you)
# - GEMINI_API_KEY        (from https://aistudio.google.com/apikey)
# - GLM_API_KEY           (from https://open.bigmodel.cn)
#
# Future v1.2 (IG auto-scrape):
# - IG_USERNAME
# - IG_PASSWORD

# Observability
[observability]
enabled = true

# Limits (free tier defaults — no need to change)
# [limits]
# cpu_ms = 10
# memory = 128
